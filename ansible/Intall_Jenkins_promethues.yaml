- name: Deploy Core DevOps Tools (Jenkins & Monitoring)
  hosts: master
  become: no
  vars:
    user_kubeconfig: "/home/ubuntu/.kube/config"
  tasks:
    - name: Ensure Namespaces Exist
      kubernetes.core.k8s:
        name: "{{ item }}"
        api_version: v1
        kind: Namespace
        state: present
      loop:
        - jenkins
        - monitoring

    - name: Add Helm Repositories
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.url }}"
      loop:
        - { name: 'jenkins', url: 'https://charts.jenkins.io' }
        - { name: 'prometheus-community', url: 'https://prometheus-community.github.io/helm-charts' }

    - name: Deploy Jenkins via Helm
      kubernetes.core.helm:
        kubeconfig: "{{ user_kubeconfig }}"
        name: jenkins
        chart_ref: jenkins/jenkins
        release_namespace: jenkins
        values_files:
          - "{{ playbook_dir }}/jenkins-values.yaml"
        state: present

    - name: Deploy kube-prometheus-stack via Helm
      kubernetes.core.helm:
        kubeconfig: "{{ user_kubeconfig }}"
        name: prometheus-stack
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: monitoring
        values_files:
          - "{{ playbook_dir }}/prometheus-values.yaml"
        state: present
